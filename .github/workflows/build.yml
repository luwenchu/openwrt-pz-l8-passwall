name: Build PZL8 PassWall firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - README.zh-Hans.md

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget curl ca-certificates xz-utils zstd squashfs-tools \
            mtd-utils jq

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: work/downloads
          key: pzl8-passwall-${{ hashFiles('pins.env') }}
          restore-keys: |
            pzl8-passwall-

      - name: Restore compiled packages
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: work/package-cache
          key: pzl8-packages-${{ hashFiles('pins.env', 'scripts/build-passwall.sh') }}

      - name: Build PassWall packages
        if: steps.package-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x scripts/*.sh
          scripts/build-passwall.sh

      - name: Save compiled packages
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/package-cache
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Repack and verify firmware
        run: |
          chmod +x scripts/*.sh
          scripts/repack-firmware.sh

      - name: Upload verified firmware
        uses: actions/upload-artifact@v4
        with:
          name: pzl8-passwall-${{ github.sha }}
          path: output/
          if-no-files-found: error
          retention-days: 30
