name: Build PZL8 PassWall firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - README.zh-Hans.md

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev python3 rsync unzip zlib1g-dev \
            file wget curl ca-certificates xz-utils zstd squashfs-tools \
            mtd-utils jq u-boot-tools device-tree-compiler

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: work/downloads
          key: pzl8-passwall-${{ hashFiles('pins.env') }}
          restore-keys: |
            pzl8-passwall-

      - name: Restore compiled packages
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: work/package-cache
          key: pzl8-packages-${{ hashFiles('package-cache.lock', 'scripts/build-passwall.sh') }}
          restore-keys: |
            pzl8-packages-

      - name: Build PassWall packages
        if: steps.package-cache.outputs.cache-matched-key == ''
        run: |
          chmod +x scripts/*.sh
          scripts/build-passwall.sh

      - name: Save compiled packages
        if: steps.package-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: work/package-cache
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Repack and verify firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/*.sh
          scripts/repack-firmware.sh

      - name: Publish verified firmware prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="pzl8-passwall-${short_sha}"
          title="PZL8 PassWall ${short_sha}"
          notes="Automated test firmware built from ${GITHUB_SHA}.

          Base kernel, DTB, QSDK WiFi and NSS stack are preserved.
          PassWall and Xray are embedded in the repacked SquashFS and disabled by default.
          Xray 1.8.24 compatibility conversion and Linux 5.4 nftables blocking fixes are included.
          PassWall postboot startup closes stdin to prevent nftables pipe deadlocks.
          First-time PassWall enablement commits the selected node before enabling autostart and starting the service.
          PZL8 SSIDs are restored after late QSDK wireless initialization.
          MosDNS and its dedicated v2dat helper are removed to provide rootfs capacity.
          The Web upgrade image retains IPv6 DHCP Relay, Quagga and ZeroTier.
          CMCC PZL8 Web sysupgrade writes the inactive rootfs slot and persists the bootconfig switch.
          The rootfs-only U-Boot recovery FIT is rebuilt from the same PassWall-patched rootfs.
          Physical boot and throughput still require router testing."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" output/* --clobber
          else
            gh release create "$tag" output/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --prerelease
          fi
